name: Build

# Ledge: test and build on GitHub's Windows runners, which already have the MSVC build tools.
# Produces an unsigned, unbundled ledge exe as a downloadable artifact. No release, no secrets.

on:
  push:
    branches: ["ledge/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Frontend helper tests
        run: node --experimental-strip-types scripts/perf-format.test.mts

      - name: Typecheck and build frontend
        run: bun run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app (no installer)
        run: bun run tauri build --no-bundle

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ledge-${{ github.sha }}
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
